[project]
name = "information-retrieval-system"
version = "0.1.0"
description = "Clean Architecture Information Retrieval System"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
